name: Build and publish NuGet packages

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run unit tests
        run: dotnet test tests/Perigon.PostgreSQL.Tests/Perigon.PostgreSQL.Tests.csproj --configuration Release

  publish:
    name: Publish NuGet packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vMAJOR.MINOR.PATCH tag; got '$GITHUB_REF_NAME'." >&2
            exit 1
          fi

          core_version="$(dotnet msbuild src/Perigon.PostgreSQL/Perigon.PostgreSQL.csproj -nologo -getProperty:Version)"
          tools_version="$(dotnet msbuild src/Perigon.PostgreSQL.Tools/Perigon.PostgreSQL.Tools.csproj -nologo -getProperty:Version)"
          if [[ "$version" != "$core_version" || "$version" != "$tools_version" ]]; then
            echo "Tag version $version does not match core ($core_version) and tools ($tools_version) project versions." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet packages
        run: |
          dotnet pack src/Perigon.PostgreSQL/Perigon.PostgreSQL.csproj \
            --configuration Release \
            --output artifacts/packages \
            -p:PackageVersion=${{ steps.version.outputs.value }} \
            -p:ContinuousIntegrationBuild=true
          dotnet pack src/Perigon.PostgreSQL.Tools/Perigon.PostgreSQL.Tools.csproj \
            --configuration Release \
            --output artifacts/packages \
            -p:PackageVersion=${{ steps.version.outputs.value }} \
            -p:ContinuousIntegrationBuild=true

      - name: Sign in to NuGet with GitHub OIDC
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER || 'NilTor' }}

      - name: Push NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          for package in \
            "artifacts/packages/Perigon.PostgreSQL.${version}.nupkg" \
            "artifacts/packages/Perigon.PostgreSQL.Tools.${version}.nupkg"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
